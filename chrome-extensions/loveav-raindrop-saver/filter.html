<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LoveAV 一体化工作台</title>
  <link rel="stylesheet" href="filter.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-mark" aria-hidden="true">爱</div>
    <div><h1>LoveAV 一体化工作台</h1><p>番号过滤 · MissAV / 123AV → Raindrop · v0.5.13 兼容</p></div>
    <nav><button id="open-settings" type="button">工作流与收藏设置</button><span>完全本地过滤</span></nav>
  </header>
  <main>
    <section class="workflow-note">
      <b>当前工作流</b>
      <span id="workflow-summary">正在读取设置…</span>
    </section>
    <section class="summary" aria-label="处理统计">
      <div><strong id="source-chars">0</strong><span>输入字符</span></div>
      <div><strong id="result-count">0</strong><span>有效番号</span></div>
      <div><strong id="trusted-count">0</strong><span>可信链接</span></div>
      <p id="status" role="status">就绪</p>
    </section>
    <section class="workspace">
      <article class="editor-card" id="drop-zone">
        <div class="card-heading"><div><h2>原始文字</h2><p>粘贴任意长度文字，或拖入多个文件</p></div><label class="file-button">导入文件<input id="files" type="file" multiple accept=".txt,.html,.htm,.md,.json,.csv,.log,text/plain,text/html,text/csv,application/json"></label></div>
        <textarea id="source" aria-label="原始文字" placeholder="支持 TG、网页文字、HTML、Markdown、Raindrop CSV、MissAV/123AV 链接或番号……" spellcheck="false" autofocus></textarea>
      </article>
      <article class="editor-card result-card">
        <div class="card-heading"><div><h2>过滤结果</h2><p>按首次出现顺序去重，一行一个</p></div><span id="format-note">普通文本</span></div>
        <textarea id="result" aria-label="过滤结果" placeholder="识别结果会显示在这里" spellcheck="false" readonly></textarea>
      </article>
    </section>
    <section class="toolbar" aria-label="操作">
      <button id="run" class="primary" type="button">执行过滤</button>
      <button id="copy" type="button">复制结果</button>
      <button id="download" type="button">下载 TXT</button>
      <button id="clear" class="danger" type="button">清空</button>
      <label class="auto-filter"><input id="auto-filter" type="checkbox" checked> 输入后自动过滤</label>
      <span class="shortcut">Ctrl + Enter 执行</span>
    </section>
    <p class="privacy-note">过滤器不请求网络、不保存输入历史；从网站面板转来的标题只在本次工作台标签页中使用。Raindrop 收藏只会在你点击网站面板的收藏按钮时执行。</p>
  </main>
  <script src="filter-core.js"></script>
  <script src="filter-app.js"></script>
</body>
</html>
