<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>MissAV Load More 验收</title></head>
<body>
  <h1>新版嵌套结构测试页</h1>
  <main id="sections"></main>
  <script>
    const names = ['推荐给你', '中文字幕', '无码影片', '随机推荐'];
    const root = document.querySelector('#sections');
    setTimeout(() => {
      for (const name of names) {
        const section = document.createElement('section');
        section.className = 'relative section-wrapper';
        section.innerHTML = `<div class="content"><h2>${name}</h2><div class="grid grid-cols-4"></div></div><div class="absolute load-control"><a href="#">載入更多</a></div>`;
        const grid = section.querySelector('.grid');
        const addCards = () => {
          for (let index = 0; index < 12; index++) {
            const card = document.createElement('article');
            card.innerHTML = `<a href="/video/${grid.children.length + 1}">测试卡片 ${grid.children.length + 1}</a>`;
            grid.appendChild(card);
          }
        };
        addCards();
        section.querySelector('a[href="#"]').addEventListener('click', (event) => {
          event.preventDefault();
          setTimeout(addCards, 30);
        });
        root.appendChild(section);
      }
    }, 250);
  </script>
  <script src="../missav-auto-loader/missav-auto-loader.js"></script>
</body>
</html>
