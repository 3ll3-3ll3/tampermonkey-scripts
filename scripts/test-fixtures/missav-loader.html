<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><title>MissAV Load More 验收</title>
  <script>
    window.GM_registerMenuCommand = (name, handler) => {
      window.__testMenuName = name;
      window.__testMenuHandler = handler;
    };
  </script>
</head>
<body>
  <h1>新版嵌套结构测试页</h1>
  <main id="sections"></main>
  <script>
    const names = ['推荐给你', '中文字幕', '无码影片', '随机推荐'];
    const root = document.querySelector('#sections');
    setTimeout(() => {
      for (const name of names) {
        const section = document.createElement('section');
        section.className = 'relative section-wrapper';
        section.innerHTML = `<div class="content"><h2>${name}</h2><div class="grid grid-cols-4"></div></div><div class="absolute load-control"><a href="#">載入更多</a></div>`;
        const grid = section.querySelector('.grid');
        const addCards = (targetGrid) => {
          for (let index = 0; index < 12; index++) {
            const card = document.createElement('article');
            card.innerHTML = `<a href="/video/${targetGrid.children.length + 1}">测试卡片 ${targetGrid.children.length + 1}</a>`;
            targetGrid.appendChild(card);
          }
        };
        const bindLoadButton = () => {
          const button = section.querySelector('a[href="#"]');
          button.addEventListener('click', (event) => {
            event.preventDefault();
            setTimeout(() => {
              const oldGrid = section.querySelector('.grid');
              const newGrid = oldGrid.cloneNode(true);
              addCards(newGrid);
              oldGrid.replaceWith(newGrid);
              const replacement = button.cloneNode(true);
              button.replaceWith(replacement);
              if (name === '推荐给你' && newGrid.children.length >= 48) {
                replacement.parentElement.remove();
                return;
              }
              bindLoadButton();
            }, 80);
          });
        };
        addCards(grid);
        bindLoadButton();
        root.appendChild(section);
      }
    }, 1200);
    setTimeout(() => {
      document.querySelector('#missav-auto-loader-panel')?.remove();
      document.querySelector('#missav-auto-loader-style')?.remove();
    }, 2600);
    setTimeout(() => {
      const replacementBody = document.createElement('body');
      replacementBody.innerHTML = '<h1>网站已替换整个 body</h1>';
      document.body.replaceWith(replacementBody);
    }, 3000);
    setTimeout(() => window.__testMenuHandler?.(), 3400);
    setTimeout(() => {
      const panel = document.querySelector('#missav-auto-loader-panel');
      const style = document.querySelector('#missav-auto-loader-style');
      const visible = panel && getComputedStyle(panel).display !== 'none';
      document.title = panel && style && visible
        ? 'PASS: 面板删除后已恢复并可由菜单唤醒'
        : 'FAIL: 面板保活失败';
    }, 4200);
  </script>
  <script src="../missav-auto-loader/missav-auto-loader.js"></script>
</body>
</html>
